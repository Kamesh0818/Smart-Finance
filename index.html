<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartFinance — Personal Finance, Kept in Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --paper:#F6F3EA;
  --paper-2:#ECE7D8;
  --card:#FFFFFE;
  --ink:#12211B;
  --ink-soft:#54655D;
  --line:#DCD4BE;
  --primary:#0F6E5C;
  --primary-deep:#0A4E42;
  --primary-tint:#E4EFEA;
  --gold:#AD8629;
  --gold-tint:#F3E9CD;
  --rust:#AE4B2C;
  --rust-tint:#F5E4DC;
  --shadow: 0 1px 2px rgba(18,33,27,0.06), 0 8px 24px -12px rgba(18,33,27,0.18);
  --radius: 10px;
  --sidebar-w: 232px;
}
[data-theme="dark"]{
  --paper:#0E1512;
  --paper-2:#161E19;
  --card:#141C18;
  --ink:#EDE8DC;
  --ink-soft:#9AA79E;
  --line:#26332C;
  --primary:#3FAE93;
  --primary-deep:#2C8A73;
  --primary-tint:#152720;
  --gold:#D3AC53;
  --gold-tint:#231D0F;
  --rust:#DC8266;
  --rust-tint:#2A1712;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  transition:background .25s ease,color .25s ease;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-0.01em;}
.num, .amount, table td.amount-cell{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
a{color:inherit;}
button{font-family:'Inter',sans-serif;cursor:pointer;}
::selection{background:var(--gold-tint);}

/* ============ UTILITIES ============ */
.hidden{display:none !important;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:8px;border:1px solid transparent;
  font-weight:600;font-size:14px;transition:all .15s ease;line-height:1;
}
.btn-primary{background:var(--ink);color:var(--paper);}
[data-theme="dark"] .btn-primary{background:var(--primary);color:#08120E;}
.btn-primary:hover{background:var(--primary-deep);color:#fff;}
.btn-outline{background:transparent;border-color:var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--ink);}
.btn-ghost{background:transparent;border:none;color:var(--ink-soft);padding:8px 10px;}
.btn-ghost:hover{color:var(--ink);}
.btn-danger{background:transparent;border-color:var(--rust);color:var(--rust);}
.btn-danger:hover{background:var(--rust);color:#fff;}
.btn-block{width:100%;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:14.5px;font-family:'Inter',sans-serif;
}
.field input:focus, .field select:focus, .field textarea:focus{
  outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary);
}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.error-text{color:var(--rust);font-size:12.5px;margin-top:5px;display:none;}
.field.invalid input, .field.invalid select{border-color:var(--rust);}
.field.invalid .error-text{display:block;}

/* ============ LEDGER SIGNATURE UNDERLINE ============ */
.ledger-underline{display:block;width:132px;height:14px;margin-top:2px;}
.ledger-underline path{stroke:var(--gold);stroke-width:3;fill:none;stroke-linecap:round;}

/* ============ TOASTS ============ */
#toast-stack{position:fixed;top:20px;right:20px;z-index:900;display:flex;flex-direction:column;gap:10px;}
.toast{
  background:var(--ink);color:var(--paper);padding:13px 16px;border-radius:8px;
  font-size:13.5px;font-weight:500;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;
  min-width:240px;max-width:340px;animation:slideIn .2s ease;
}
.toast.success{border-left:3px solid var(--primary);}
.toast.error{border-left:3px solid var(--rust);}
@keyframes slideIn{from{opacity:0;transform:translateX(16px);}to{opacity:1;transform:translateX(0);}}

/* ============ AUTH / MARKETING LAYOUT ============ */
.pub-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 6vw;border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px;font-family:'Fraunces',serif;font-weight:700;font-size:19px;}
.brand-mark{
  width:30px;height:30px;border-radius:7px;background:var(--ink);color:var(--paper);
  display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;
}
[data-theme="dark"] .brand-mark{background:var(--primary);color:#08120E;}
.pub-actions{display:flex;gap:10px;align-items:center;}

.hero{padding:9vh 6vw 8vh;display:grid;grid-template-columns:1.1fr .9fr;gap:60px;align-items:center;}
.hero-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);margin-bottom:16px;}
.hero h1{font-size:clamp(34px,4.6vw,58px);line-height:1.05;margin:0 0 20px;}
.hero p.lead{font-size:17px;color:var(--ink-soft);line-height:1.6;max-width:480px;margin:0 0 28px;}
.hero-actions{display:flex;gap:12px;margin-bottom:10px;}
.stamp{
  width:96px;height:96px;border-radius:50%;border:2px solid var(--gold);color:var(--gold);
  display:flex;align-items:center;justify-content:center;text-align:center;font-family:'IBM Plex Mono',monospace;
  font-size:10px;line-height:1.3;letter-spacing:.05em;transform:rotate(-8deg);position:absolute;
}
.hero-visual{position:relative;}
.ledger-card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:var(--shadow);
  background-image: repeating-linear-gradient(var(--card) 0 39px, var(--line) 40px);
  background-position: 0 60px;
}
.ledger-card .lc-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;background:var(--card);padding-right:4px;}
.ledger-card .lc-row{display:flex;justify-content:space-between;font-size:14px;padding:9px 0;background:var(--card);padding-right:4px;}
.ledger-card .lc-row span:last-child{font-family:'IBM Plex Mono',monospace;}
.pos{color:var(--primary);}
.neg{color:var(--rust);}

.feature-strip{padding:2vh 6vw 10vh;border-top:1px solid var(--line);}
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:34px;}
.feature-card{padding:22px 4px;}
.feature-num{font-family:'IBM Plex Mono',monospace;color:var(--gold);font-size:13px;margin-bottom:10px;}
.feature-card h3{font-size:17px;margin:0 0 8px;}
.feature-card p{font-size:14px;color:var(--ink-soft);line-height:1.6;margin:0;}

/* Auth pages */
.auth-wrap{min-height:100vh;display:flex;}
.auth-side{
  flex:1;background:var(--ink);color:var(--paper);padding:56px;display:flex;flex-direction:column;justify-content:space-between;
}
[data-theme="dark"] .auth-side{background:var(--paper-2);}
.auth-side blockquote{font-family:'Fraunces',serif;font-size:26px;line-height:1.35;font-weight:500;max-width:420px;}
.auth-form-col{width:460px;max-width:100%;display:flex;align-items:center;justify-content:center;padding:40px;}
.auth-box{width:100%;max-width:360px;}
.auth-box h2{font-size:26px;margin:18px 0 6px;}
.auth-box p.sub{color:var(--ink-soft);font-size:14px;margin:0 0 28px;}
.auth-switch{text-align:center;font-size:13.5px;color:var(--ink-soft);margin-top:18px;}
.auth-switch a{color:var(--primary);font-weight:600;text-decoration:none;}
.demo-note{background:var(--gold-tint);border:1px solid var(--gold);color:var(--ink);font-size:12.5px;padding:10px 12px;border-radius:8px;margin-top:18px;line-height:1.5;}

/* ============ APP SHELL ============ */
.app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--ink);color:var(--paper);
  display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;padding:24px 18px;
  transition:transform .2s ease;z-index:80;
}
[data-theme="dark"] .sidebar{background:var(--paper-2);border-right:1px solid var(--line);}
.sidebar .brand{color:var(--paper);margin-bottom:34px;padding-left:4px;}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#8B978F;margin:18px 0 8px;padding-left:12px;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:#C7D0C9;
  text-decoration:none;font-size:14px;font-weight:500;margin-bottom:2px;
}
.nav-item .ic{width:18px;height:18px;flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:var(--primary);color:#fff;}
.nav-item.disabled{color:#5B655F;cursor:default;}
.nav-item.disabled:hover{background:none;}
.nav-badge{margin-left:auto;font-size:9.5px;background:rgba(255,255,255,0.08);padding:2px 6px;border-radius:20px;color:#9AA79E;}
.sidebar-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,0.1);padding-top:14px;}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px 10px;}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--gold);color:#241B05;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.user-chip .un{font-size:13px;font-weight:600;color:#fff;line-height:1.2;}
.user-chip .ue{font-size:11.5px;color:#8B978F;}

.main{margin-left:var(--sidebar-w);flex:1;min-width:0;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;padding:18px 32px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:60;
}
.topbar h1{font-size:22px;margin:0;}
.topbar .sub{font-size:13px;color:var(--ink-soft);margin-top:2px;}
.topbar-actions{display:flex;align-items:center;gap:10px;}
.icon-btn{
  width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;
}
.menu-toggle{display:none;}
.page{padding:28px 32px 60px;}

/* Cards */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.stat-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);
}
.stat-card .label{font-size:12.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;}
.stat-card .value{font-family:'Fraunces',serif;font-size:27px;font-weight:600;}
.stat-card .delta{font-size:12px;margin-top:8px;font-weight:600;}
.stat-card.hero-stat{grid-column:span 1;background:var(--ink);color:var(--paper);border:none;}
[data-theme="dark"] .stat-card.hero-stat{background:var(--primary);color:#08120E;}
.stat-card.hero-stat .label{color:#B9C4BC;}
[data-theme="dark"] .stat-card.hero-stat .label{color:#0A2A20;}

.grid-2{display:grid;grid-template-columns:1.3fr .9fr;gap:18px;margin-bottom:22px;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);}
.panel-head h3{font-size:15.5px;margin:0;}
.panel-body{padding:18px 20px;}
.chart-holder{position:relative;height:260px;}

.roadmap-card{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);}
.roadmap-card:last-child{border-bottom:none;}
.roadmap-card .rc-title{font-size:13.5px;font-weight:600;}
.roadmap-card .rc-note{font-size:11.5px;color:var(--ink-soft);}
.pill{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:20px;}
.pill-soon{background:var(--gold-tint);color:var(--gold);}

/* Transactions list */
.tx-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.tx-row:last-child{border-bottom:none;}
.tx-ic{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;}
.tx-ic.in{background:var(--primary-tint);color:var(--primary);}
.tx-ic.out{background:var(--rust-tint);color:var(--rust);}
.tx-meta{flex:1;min-width:0;}
.tx-meta .t-title{font-size:13.5px;font-weight:600;}
.tx-meta .t-sub{font-size:11.5px;color:var(--ink-soft);}
.tx-amt{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;}

/* Tables */
.table-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.table-toolbar input, .table-toolbar select{
  padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13.5px;
}
.table-toolbar input[type="text"]{min-width:200px;flex:1;}
.data-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.data-table th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);
  padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;
}
.data-table td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
.data-table tr:hover td{background:var(--paper-2);}
.data-table td.amount-cell{font-weight:600;text-align:right;}
.cat-chip{font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;background:var(--paper-2);}
.row-actions{display:flex;gap:6px;justify-content:flex-end;}
.row-actions button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;}
.row-actions button:hover{border-color:var(--ink);}
.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-state .em-ic{font-size:34px;margin-bottom:10px;}

/* Progress bars & status pills */
.progress-track{height:8px;background:var(--paper-2);border-radius:20px;overflow:hidden;}
.progress-fill{height:100%;border-radius:20px;transition:width .3s ease;}
.progress-fill.ok{background:var(--primary);}
.progress-fill.warn{background:var(--gold);}
.progress-fill.over{background:var(--rust);}
.status-pill{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:20px;white-space:nowrap;}
.status-pill.ok{background:var(--primary-tint);color:var(--primary);}
.status-pill.warn{background:var(--gold-tint);color:var(--gold);}
.status-pill.over{background:var(--rust-tint);color:var(--rust);}

/* Budget rows */
.month-select{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13.5px;}
.budget-summary-bar{margin:14px 0 4px;}
.budget-row{padding:16px 20px;border-bottom:1px solid var(--line);}
.budget-row:last-child{border-bottom:none;}
.budget-row-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:9px;}
.budget-row-head .br-cat{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.budget-row-head input{width:110px;padding:7px 10px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;font-family:'IBM Plex Mono',monospace;text-align:right;}
.budget-row-nums{font-size:12px;color:var(--ink-soft);margin-top:7px;display:flex;justify-content:space-between;}

/* Savings goals */
.goal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;}
.goal-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
.goal-card.reached{border-color:var(--primary);}
.goal-card .gc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}
.goal-card h4{font-family:'Fraunces',serif;font-size:16.5px;margin:0 0 4px;}
.goal-card .gc-date{font-size:11.5px;color:var(--ink-soft);}
.goal-card .gc-nums{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin:14px 0 8px;}
.goal-card .gc-nums .saved{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:17px;color:var(--primary);}
.goal-card .gc-nums .target{font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);font-size:12.5px;}
.goal-card .gc-pct{font-size:11.5px;color:var(--ink-soft);margin-top:7px;}
.goal-card .gc-actions{display:flex;gap:8px;margin-top:16px;}
.goal-card .gc-actions .btn{flex:1;padding:8px 10px;font-size:12.5px;}
.goal-card .gc-icon-btn{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mini-goal{display:flex;flex-direction:column;gap:6px;padding:12px 20px;border-bottom:1px solid var(--line);}
.mini-goal:last-child{border-bottom:none;}
.mini-goal .mg-head{display:flex;justify-content:space-between;font-size:13px;font-weight:600;}
.mini-goal .mg-sub{font-size:11.5px;color:var(--ink-soft);}

/* Finance assistant */
.assistant-panel .panel-body{padding:0;}
.chat-log{max-height:320px;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px;}
.chat-msg{display:flex;gap:10px;max-width:88%;}
.chat-msg .bubble{padding:10px 13px;border-radius:12px;font-size:13.5px;line-height:1.5;}
.chat-msg.ai{align-self:flex-start;}
.chat-msg.ai .bubble{background:var(--paper-2);border-bottom-left-radius:3px;}
.chat-msg.user{align-self:flex-end;flex-direction:row-reverse;}
.chat-msg.user .bubble{background:var(--ink);color:var(--paper);border-bottom-right-radius:3px;}
[data-theme="dark"] .chat-msg.user .bubble{background:var(--primary);color:#08120E;}
.chat-avatar{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--gold-tint);}
.chat-suggestions{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 14px;}
.suggestion-chip{font-size:12px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);}
.suggestion-chip:hover{border-color:var(--primary);color:var(--ink);}
.chat-input-row{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);}
.chat-input-row input{flex:1;padding:10px 13px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13.5px;}
.chat-input-row button{padding:10px 16px;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,20,17,.55);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px;}
.modal{background:var(--card);border-radius:14px;width:460px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line);}
.modal-head h3{margin:0;font-size:17px;}
.modal-body{padding:22px;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}

/* Confirm dialog */
.confirm-box{width:380px;text-align:center;padding:26px 24px;}
.confirm-box .em-ic{font-size:30px;margin-bottom:10px;}
.confirm-box h3{margin:0 0 8px;font-size:16.5px;}
.confirm-box p{font-size:13.5px;color:var(--ink-soft);margin:0 0 20px;}
.confirm-actions{display:flex;gap:10px;justify-content:center;}

footer.pub-footer{padding:24px 6vw;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);display:flex;justify-content:space-between;}

@media(max-width:980px){
  .hero{grid-template-columns:1fr;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .grid-2{grid-template-columns:1fr;}
  .feature-grid{grid-template-columns:1fr;}
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .menu-toggle{display:flex;}

<script>
/* =====================================================================
   SmartFinance — frontend-only prototype
   Persistence: browser localStorage (no server). This simulates the
   data model described in the spec (users / income / expenses) so the
   UI and flows are fully real; a Spring Boot + MySQL backend can later
   replace the DB.* functions below one-for-one with real REST calls.
   NOTE ON AUTH: password handling here is a lightweight client-side
   obfuscation for demo purposes only — it is NOT secure storage and
   must be replaced by real hashing (e.g. BCrypt) on the backend.
===================================================================== */

const LS_KEYS = {
  users: 'sf_users',
  session: 'sf_session',
  theme: 'sf_theme',
};
const dataKey = (userId, kind) => `sf_${kind}_${userId}`;

const CATEGORIES_INCOME = ['Salary','Freelance','Business','Investment','Other'];
const CATEGORIES_EXPENSE = ['Food','Transport','Shopping','Bills','Education','Healthcare','Entertainment','Rent','Other'];
const PAYMENT_METHODS = ['UPI','Debit Card','Credit Card','Cash','Net Banking'];
const EXPENSE_ICONS = {Food:'🍽️',Transport:'🚕',Shopping:'🛍️',Bills:'🧾',Education:'📚',Healthcare:'🩺',Entertainment:'🎬',Rent:'🏠',Other:'📌'};
const INCOME_ICONS = {Salary:'💼',Freelance:'💻',Business:'🏢',Investment:'📈',Other:'💰'};

/* ---------- tiny "DB" layer over localStorage ---------- */
const DB = {
  getUsers(){ return JSON.parse(localStorage.getItem(LS_KEYS.users) || '[]'); },
  saveUsers(u){ localStorage.setItem(LS_KEYS.users, JSON.stringify(u)); },
  findUserByEmail(email){ return this.getUsers().find(u => u.email.toLowerCase() === email.toLowerCase()); },
  createUser({name, email, password}){
    const users = this.getUsers();
    const user = { id: 'u_' + Date.now().toString(36), name, email, passwordObf: obfuscate(password), createdAt: new Date().toISOString() };
    users.push(user);
    this.saveUsers(users);
    seedDemoData(user.id);
    return user;
  },
  setSession(userId){ localStorage.setItem(LS_KEYS.session, userId); },
  getSession(){ return localStorage.getItem(LS_KEYS.session); },
  clearSession(){ localStorage.removeItem(LS_KEYS.session); },

  list(userId, kind){ return JSON.parse(localStorage.getItem(dataKey(userId, kind)) || '[]'); },
  save(userId, kind, arr){ localStorage.setItem(dataKey(userId, kind), JSON.stringify(arr)); },
  add(userId, kind, record){
    const arr = this.list(userId, kind);
    record.id = kind.slice(0,1) + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    arr.unshift(record);
    this.save(userId, kind, arr);
    return record;
  },
  update(userId, kind, id, patch){
    const arr = this.list(userId, kind).map(r => r.id === id ? {...r, ...patch} : r);
    this.save(userId, kind, arr);
  },
  remove(userId, kind, id){
    const arr = this.list(userId, kind).filter(r => r.id !== id);
    this.save(userId, kind, arr);
  }
};

function obfuscate(str){
  // Reversible demo-only transform. NOT cryptographic. Replace with server-side hashing.
  return btoa(unescape(encodeURIComponent('sf::' + str)));
}

/* ---------- budgets & savings goals helpers ---------- */
function monthKeyOf(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function currentMonthKey(){ return monthKeyOf(new Date()); }
function monthKeyLabel(mk){
  const [y,m] = mk.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('en-IN', {month:'long', year:'numeric'});
}
function getBudget(userId, monthKey){
  return DB.list(userId,'budgets').find(b => b.month === monthKey) || null;
}
function saveBudget(userId, monthKey, totalBudget, categoryBudgets){
  const existing = getBudget(userId, monthKey);
  const record = { month: monthKey, totalBudget: totalBudget||0, categoryBudgets };
  if(existing) DB.update(userId,'budgets', existing.id, record);
  else DB.add(userId,'budgets', record);
}
function categorySpentForMonth(userId, monthKey){
  const [y,m] = monthKey.split('-').map(Number);
  const totals = {};
  CATEGORIES_EXPENSE.forEach(c => totals[c]=0);
  DB.list(userId,'expenses').forEach(r => {
    const d = new Date(r.date);
    if(d.getFullYear()===y && d.getMonth()===m-1) totals[r.category] = (totals[r.category]||0) + Number(r.amount);
  });
  return totals;
}
function budgetStatus(spent, budget){
  if(!budget || budget<=0) return null;
  const pct = spent/budget*100;
  if(pct >= 100) return {level:'over', pct, label:'Exceeded'};
  if(pct >= 80) return {level:'warn', pct, label:'Near limit'};
  return {level:'ok', pct, label:'Under budget'};
}
function seedDemoBudgetsAndGoals(userId){

    {id:'g_'+Math.random().toString(36).slice(2,9), name:'Emergency Fund', targetAmount:150000, savedAmount:62000, targetDate: new Date(new Date().getFullYear(), new Date().getMonth()+8, 1).toISOString().slice(0,10), createdAt:new Date().toISOString()},
    {id:'g_'+Math.random().toString(36).slice(2,9), name:'Buy Laptop', targetAmount:80000, savedAmount:35000, targetDate: new Date(new Date().getFullYear(), new Date().getMonth()+3, 1).toISOString().slice(0,10), createdAt:new Date().toISOString()},
    {id:'g_'+Math.random().toString(36).slice(2,9), name:'Goa Trip', targetAmount:40000, savedAmount:40000, targetDate: new Date(new Date().getFullYear(), new Date().getMonth()+1, 1).toISOString().slice(0,10), createdAt:new Date().toISOString()},
  ]);
}

/* ---------- router ---------- */
const PUBLIC_ROUTES = ['landing','login','register'];
function currentRoute(){ return (location.hash || '#/landing').replace('#/','').split('?')[0] || 'landing'; }
function navigate(route){ location.hash = '#/' + route; }
window.addEventListener('hashchange', render);
window.addEventListener('load', () => { initTheme(); render(); });

function requireAuthGate(){
  const route = currentRoute();
  const session = DB.getSession();
  if(!PUBLIC_ROUTES.includes(route) && !session){
    navigate('login');
    return false;
  }
  if(PUBLIC_ROUTES.includes(route) && session && route !== 'landing'){
    navigate('dashboard');
    return false;
  }
  return true;
}

function render(){
  if(!requireAuthGate()) return;
  const route = currentRoute();
  const app = document.getElementById('app');
  if(route === 'landing') app.innerHTML = LandingView();
  else if(route === 'login') app.innerHTML = LoginView();
  else if(route === 'register') app.innerHTML = RegisterView();
  else if(route === 'dashboard') app.innerHTML = AppShell('dashboard', DashboardView());
  else if(route === 'income') app.innerHTML = AppShell('income', IncomeView());
  else if(route === 'expenses') app.innerHTML = AppShell('expenses', ExpensesView());
  else if(route === 'budgets') app.innerHTML = AppShell('budgets', BudgetsView());
  else if(route === 'savings') app.innerHTML = AppShell('savings', SavingsView());
  else if(route === 'advisor') app.innerHTML = AppShell('advisor', AdvisorView());
  else if(route === 'crisis') app.innerHTML = AppShell('crisis', CrisisView());
  else if(route === 'invest') app.innerHTML = AppShell('invest', InvestView());
  else if(route === 'reports') app.innerHTML = AppShell('reports', ReportsView());
  else if(route === 'alerts') app.innerHTML = AppShell('alerts', AlertsView());
  else app.innerHTML = LandingView();
  afterRender(route);
}

let dashboardMonth = currentMonthKey();

function computeTotals(userId, monthKey){
  monthKey = monthKey || dashboardMonth;
  const income = DB.list(userId,'income');
  const expenses = DB.list(userId,'expenses');
  const totalIncome = income.reduce((s,r)=>s+Number(r.amount),0);
  const totalExpense = expenses.reduce((s,r)=>s+Number(r.amount),0);
  const balance = totalIncome - totalExpense;
  const thisMonth = (r) => monthKeyOf(new Date(r.date)) === monthKey;
  const monthIncome = income.filter(thisMonth).reduce((s,r)=>s+Number(r.amount),0);
  const monthExpense = expenses.filter(thisMonth).reduce((s,r)=>s+Number(r.amount),0);
  const monthSavings = monthIncome - monthExpense;
  return { income, expenses, totalIncome, totalExpense, balance, monthIncome, monthExpense, monthSavings };
}

/* ===================== FINANCE ASSISTANT (rule-based, on-device) =====================
   NOTE: This runs entirely in the browser against the signed-in user's own data.
   It is NOT a connection to a hosted LLM — embedding a real API key in a static
   HTML file that runs on someone else's machine would expose that key to anyone
   who opens dev tools, so this is intentionally a local, key-free assistant.
   Once a backend exists, POST the question + a data summary to a server route
   that calls the Claude API server-side, and swap the body of answerFinanceQuestion()
   for that fetch — the chat UI above needs no changes.
======================================================================================= */
let assistantMessages = [
  { role:'ai', text:"Hi! I can answer questions about your spending, income, budget and goals — try one of the suggestions below, or type your own." }
];

function topExpenseCategory(userId, monthKey){
  const totals = categorySpentForMonth(userId, monthKey);
  const entries = Object.entries(totals).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  return entries[0] || null;
}

function answerFinanceQuestion(q, userId){
  const query = q.toLowerCase();
  const mk = dashboardMonth;
  const t = computeTotals(userId, mk);
  const monthLbl = monthKeyLabel(mk);

  if(/spend|spent|category|highest|most/.test(query)){
    const top = topExpenseCategory(userId, mk);
    if(!top) return `You don't have any expenses logged for ${monthLbl} yet.`;
    const [cat, amt] = top;
    return `Your highest spending category in ${monthLbl} was ${cat}, with ${fmtINR(amt)} spent.`;
  }
  if(/save|saving|savings/.test(query) && !/goal/.test(query)){
    const rate = t.monthIncome > 0 ? Math.round((t.monthSavings/t.monthIncome)*100) : 0;
    return t.monthSavings >= 0
      ? `You saved ${fmtINR(t.monthSavings)} in ${monthLbl} — about ${rate}% of your income that month.`
      : `You spent ${fmtINR(Math.abs(t.monthSavings))} more than you earned in ${monthLbl}.`;
  }
  if(/budget/.test(query)){
    const budget = getBudget(userId, mk);
    if(!budget || !budget.totalBudget) return `You haven't set a budget for ${monthLbl} yet — head to the Budgets page to set one.`;
    const status = budgetStatus(t.monthExpense, budget.totalBudget);
    const remaining = budget.totalBudget - t.monthExpense;
    return remaining >= 0
      ? `You're within budget for ${monthLbl}: ${fmtINR(t.monthExpense)} spent of ${fmtINR(budget.totalBudget)}, ${fmtINR(remaining)} left (${status.label.toLowerCase()}).`
      : `You've gone over budget for ${monthLbl} by ${fmtINR(Math.abs(remaining))} (spent ${fmtINR(t.monthExpense)} of ${fmtINR(budget.totalBudget)}).`;
  }
  if(/goal/.test(query)){
    const goals = DB.list(userId,'goals');
    if(!goals.length) return `You don't have any savings goals yet — add one on the Savings Goals page.`;
    const reached = goals.filter(g=>g.savedAmount>=g.targetAmount).length;
    const lines = goals.slice(0,3).map(g => `${g.name}: ${Math.min(100,Math.round(g.savedAmount/g.targetAmount*100))}%`).join(', ');
    return `You have ${goals.length} goal${goals.length>1?'s':''} (${reached} reached). Progress — ${lines}.`;
  }
  if(/income|earn/.test(query)){
    return `Your income in ${monthLbl} was ${fmtINR(t.monthIncome)}, and ${fmtINR(t.totalIncome)} in total across all recorded months.`;
  }
  if(/expense|expenses/.test(query)){
    return `Your expenses in ${monthLbl} were ${fmtINR(t.monthExpense)}, and ${fmtINR(t.totalExpense)} in total across all recorded months.`;
  }
  if(/balance/.test(query)){
    return `Your current total balance is ${fmtINR(t.balance)} (${fmtINR(t.totalIncome)} in, ${fmtINR(t.totalExpense)} out).`;
  }
  return `I can answer questions about spending by category, income, savings, budget status, and goal progress for ${monthLbl} — try "Where did I spend the most?" or "Am I over budget?"`;
}

function renderAssistantLog(){
  const log = document.getElementById('assistant-log');
  if(!log) return;
  log.innerHTML = assistantMessages.map(m => `
    <div class="chat-msg ${m.role==='ai'?'ai':'user'}">
      <div class="chat-avatar">${m.role==='ai'?'₹':'🙂'}</div>
      <div class="bubble">${escapeHtml(m.text)}</div>
    </div>`).join('');
  log.scrollTop = log.scrollHeight;
}

function askAssistant(question){
  const userId = DB.getSession();
  assistantMessages.push({role:'user', text:question});
  assistantMessages.push({role:'ai', text: answerFinanceQuestion(question, userId)});
  renderAssistantLog();
}

function sendAssistantMessage(){
  const input = document.getElementById('assistant-input');
  const q = (input.value || '').trim();
  if(!q) return;
  input.value = '';
  askAssistant(q);
}

/* chart theme colors, read live from CSS variables */
function cssVar(name){ return getComputedStyle(document.body).getPropertyValue(name).trim(); }
let chartTrend, chartCategory;
function renderCharts(){
  const userId = DB.getSession();
  if(!userId || currentRoute() !== 'dashboard') return;
  const trendCanvas = document.getElementById('chart-trend');
  const catCanvas = document.getElementById('chart-category');
  if(!trendCanvas || !catCanvas) return;

  const t = computeTotals(userId);
  const ink = cssVar('--ink-soft'), line = cssVar('--line'), primary = cssVar('--primary'), rust = cssVar('--rust');

  // last 6 months buckets
  const now = new Date();
  const months = [];
  for(let i=5;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); months.push(d); }
  const labels = months.map(monthLabel);
  const incomeSeries = months.map(d => t.income.filter(r=>{const rd=new Date(r.date); return rd.getMonth()===d.getMonth() && rd.getFullYear()===d.getFullYear();}).reduce((s,r)=>s+Number(r.amount),0));
  const expenseSeries = months.map(d => t.expenses.filter(r=>{const rd=new Date(r.date); return rd.getMonth()===d.getMonth() && rd.getFullYear()===d.getFullYear();}).reduce((s,r)=>s+Number(r.amount),0));

  if(chartTrend) chartTrend.destroy();
  chartTrend = new Chart(trendCanvas, {
    type:'bar',
    data:{ labels, datasets:[
      {label:'Income', data:incomeSeries, backgroundColor:primary, borderRadius:5, maxBarThickness:22},
      {label:'Expenses', data:expenseSeries, backgroundColor:rust, borderRadius:5, maxBarThickness:22},
    ]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{position:'bottom', labels:{color:ink, boxWidth:10, font:{size:11.5}}}},
      scales:{
        x:{ grid:{display:false}, ticks:{color:ink, font:{size:11.5}} },
        y:{ grid:{color:line}, ticks:{color:ink, font:{size:11}, callback:(v)=>'₹'+(v/1000)+'k'} }
      }
    }
  });

  const catTotals = {};
  CATEGORIES_EXPENSE.forEach(c => catTotals[c]=0);
  t.expenses.forEach(r => { catTotals[r.category] = (catTotals[r.category]||0) + Number(r.amount); });
  const catEntries = Object.entries(catTotals).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const palette = ['#0F6E5C','#AD8629','#AE4B2C','#3C6E8F','#7A5FA6','#5B8A3C','#B85C9E','#8A6A3C','#4C7A7A'];

  if(chartCategory) chartCategory.destroy();
  if(catEntries.length === 0){
    catCanvas.getContext('2d').clearRect(0,0,catCanvas.width,catCanvas.height);
  } else {
    chartCategory = new Chart(catCanvas, {
      type:'doughnut',
      data:{ labels: catEntries.map(e=>e[0]), datasets:[{ data: catEntries.map(e=>e[1]), backgroundColor: palette, borderColor: cssVar('--card'), borderWidth:2 }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'62%',
        plugins:{ legend:{ position:'bottom', labels:{color:ink, boxWidth:10, font:{size:11}} } } }
    });
  }
}

function renderBudgetPanel(){

  const totalBudget = budget ? budget.totalBudget : 0;

  const summaryEl = document.getElementById('budget-summary');
  if(summaryEl){
    if(totalBudget > 0){
      const status = budgetStatus(totalSpent, totalBudget);
      const remaining = totalBudget - totalSpent;
      summaryEl.innerHTML = `
        <div class="field-row" style="margin-bottom:6px;">
          <div>
            <label style="font-size:12.5px;font-weight:600;color:var(--ink-soft);">Total budget for ${monthKeyLabel(mk)}</label>
            <input type="number" id="budget-total-input" min="0" step="500" value="${totalBudget}" style="margin-top:6px;width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:'IBM Plex Mono',monospace;">
          </div>
          <div>
            <div style="font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;">Status</div>
            <div style="display:flex;align-items:center;gap:10px;height:44px;">
              <span class="status-pill ${status.level}">${status.label}</span>
              <span class="num" style="font-size:13px;color:${remaining<0?'var(--rust)':'var(--ink-soft)'};">${remaining<0?'Over by '+fmtINR(Math.abs(remaining)):fmtINR(remaining)+' remaining'}</span>
            </div>
          </div>
        </div>
        <div class="budget-summary-bar">
          <div class="progress-track"><div class="progress-fill ${status.level}" style="width:${Math.min(100,status.pct)}%;"></div></div>
          <div class="budget-row-nums"><span>Spent: ${fmtINR(totalSpent)}</span><span>Budget: ${fmtINR(totalBudget)}</span></div>
        </div>`;
    } else {
      summaryEl.innerHTML = `
        <label style="font-size:12.5px;font-weight:600;color:var(--ink-soft);">Set a total budget for ${monthKeyLabel(mk)}</label>
        <input type="number" id="budget-total-input" min="0" step="500" placeholder="e.g. 60000" style="margin-top:6px;width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:'IBM Plex Mono',monospace;">
        <div style="font-size:12.5px;color:var(--ink-soft);margin-top:10px;">You've spent ${fmtINR(totalSpent)} so far this month.</div>`;
    }
  }

  const catsEl = document.getElementById('budget-categories');
  if(catsEl){
    catsEl.innerHTML = CATEGORIES_EXPENSE.map(c => {
      const catBudget = (budget && budget.categoryBudgets && budget.categoryBudgets[c]) || 0;
      const spent = spentByCat[c] || 0;
      const status = budgetStatus(spent, catBudget);
      return `
        <div class="budget-row">
          <div class="budget-row-head">
            <span class="br-cat">${EXPENSE_ICONS[c]} ${c}</span>
            ${status ? `<span class="status-pill ${status.level}">${status.label}</span>` : ''}
            <input type="number" min="0" step="100" class="budget-cat-input" data-category="${c}" value="${catBudget||''}" placeholder="No limit">
          </div>
          ${catBudget>0 ? `
            <div class="progress-track"><div class="progress-fill ${status.level}" style="width:${Math.min(100,status.pct)}%;"></div></div>
            <div class="budget-row-nums"><span>Spent: ${fmtINR(spent)}</span><span>Budget: ${fmtINR(catBudget)}</span></div>
          ` : `<div class="budget-row-nums"><span>Spent so far: ${fmtINR(spent)}</span><span></span></div>`}
        </div>`;
    }).join('');
  }
}

function saveBudgetForm(){
  const userId = DB.getSession();
  const mk = document.getElementById('budget-month')?.value || currentMonthKey();
  const totalBudget = parseFloat(document.getElementById('budget-total-input')?.value) || 0;
  const categoryBudgets = {};
  document.querySelectorAll('.budget-cat-input').forEach(inp => {
    const v = parseFloat(inp.value);
    if(v > 0) categoryBudgets[inp.dataset.category] = v;
  });
  saveBudget(userId, mk, totalBudget, categoryBudgets);
  renderBudgetPanel();
  toast('Budget saved for ' + monthKeyLabel(mk) + '.', 'success');
}

function filteredRows(userId, kind, searchFields){
  const rows = DB.list(userId, kind);
  const q = (document.getElementById(kind+'-search')?.value || '').toLowerCase().trim();
  const cat = document.getElementById(kind+'-filter-cat')?.value || '';
  const month = document.getElementById(kind+'-filter-month')?.value || '';
  const from = document.getElementById(kind+'-filter-from')?.value || '';
  const to = document.getElementById(kind+'-filter-to')?.value || '';
  return rows.filter(r => {
    if(cat && r.category !== cat) return false;
    if(month && monthKeyOf(new Date(r.date)) !== month) return false;
    if(from && r.date < from) return false;
    if(to && r.date > to) return false;
    if(q){
      const hay = searchFields.map(f=>String(r[f]||'').toLowerCase()).join(' ');
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b)=> new Date(b.date)-new Date(a.date));
}

      }
      DB.setSession(user.id);
      toast('Welcome back, ' + user.name.split(' ')[0] + '!', 'success');
      navigate('dashboard');
    });
  }
  if(route === 'register'){
    document.getElementById('register-form').addEventListener('submit', (e)=>{
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();

      const user = DB.createUser({name, email, password});
      DB.setSession(user.id);
      toast('Account created — welcome to SmartFinance!', 'success');
      navigate('dashboard');
    });

  if(route === 'dashboard'){ loadChat(); renderCharts(); renderAssistantLog(); }

}

 else {extra=val;name='EMI / debt burden +'+fmtINR(val)+'/mo';}
 const cash=Math.max(c.liquid-hit,0);
 const burnNormal=Math.max(c.avgExp+extra-income,0),burnSurv=Math.max(c.ess+extra-income,0);
 const m=(b)=>b<=0?Infinity:cash/b;
 const cuts=CATEGORIES_EXPENSE.filter(k=>!ESSENTIAL.includes(k)).map(k=>[k,c.byCat[k]||0]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
 return {name,cash,burnNormal,burnSurv,mN:m(burnNormal),mS:m(burnSurv),cuts,freed:cuts.reduce((s,x)=>s+x[1],0),income};
}
const fm=m=>m===Infinity?'indefinitely':(m<1?'<1 month':m.toFixed(1)+' months');
function crisisText(c,sc,val){
 const r=crisisCalc(c,sc,val),sev=r.mS<3?'🔴 Critical':r.mS<6?'🟠 Tight':'🟢 Manageable';
 return `**${r.name}** — ${sev}\n`+
 `Cash available: **${fmtINR(r.cash)}**. At current spending you last **${fm(r.mN)}**; in survival mode (essentials only, ${fmtINR(r.ess=c.ess)}/mo) you last **${fm(r.mS)}**.\n\n`+
 `**Do this, in order:**\n- Week 1: freeze all non-essential spends — that frees ~${fmtINR(r.freed)}/mo (${r.cuts.slice(0,3).map(x=>x[0]).join(', ')||'none logged'}).\n- Pay in this priority: rent/EMIs → insurance premiums → food & utilities → credit-card *minimum* dues.\n- Never break health/term insurance or take payday/instant loans; ask lenders for an EMI moratorium or restructuring first.\n- Move all cash to a liquid fund/sweep-in FD (no lock-in) and stop SIPs into equity for now — don't sell equity at a loss unless cash runs below 2 months.\n- Days 30–60: freelance/consulting income, claim EPF/ESIC/unemployment support if eligible, negotiate rent/bills.\n- Rebuild: once stable, restore the emergency fund to 6× essentials (${fmtINR(c.target)}).\n\nOpen **Crisis Planner** to simulate other scenarios and apply a survival budget.`;
}
function investText(c,hz,risk){
 const parts=(hz?[hz]:['short','long']).map(h=>{
  const a=ALLOC[h][risk||'med'];
  return `**${h==='short'?'Short term (<3 yrs)':h==='medium'?'Medium (3–7 yrs)':'Long term (7+ yrs)'}** (${risk||'medium'} risk)\n`+a.map(([id,p])=>`- ${p}% ${PRODUCTS[id].n} (~${PRODUCTS[id].r}%) — ${PRODUCTS[id].where}`).join('\n');});
 const efGap=c.liquid<c.target?`⚠ First build your emergency fund: you hold ${c.runway.toFixed(1)} months of essentials vs the 6-month target (${fmtINR(c.target)}). Keep that in liquid fund/FD before investing more.\n\n`:'';
 return efGap+parts.join('\n\n')+`\n\nYou currently free up about **${fmtINR(Math.max(c.surplus,0))}/mo** to invest. See **Invest & Insurance** for projections. Rates shown: government small-savings rates for Jul–Sep 2026 and indicative market returns (not guaranteed). This is general education, not licensed investment advice.`;
}
function insuranceText(){
 return '**Insurance priorities (in order):**\n'+INSURANCE.map(x=>`- **${x[0]}** — ${x[1]} ${x[2]}`).join('\n')+'\n\nTip: buy protection and investment separately; check premiums fit under ~5–10% of income.';
}
function healthText(c){
 const tips=[];
 if(c.rate<20)tips.push(`Raise savings rate from ${c.rate.toFixed(0)}% toward 20%.`);
 if(c.runway<6)tips.push(`Emergency fund covers ${c.runway.toFixed(1)} of 6 months.`);
 if(c.ccShare>35)tips.push(`Credit cards are ${c.ccShare.toFixed(0)}% of spending — pay in full each month.`);
 if(!c.b)tips.push('Set a monthly budget.');
 return `**Financial health score: ${c.score}/100 — ${scoreLabel(c.score)}**\n- Avg monthly income ${fmtINR(c.avgInc)}, spending ${fmtINR(c.avgExp)}, surplus ${fmtINR(c.surplus)}\n- Savings rate ${c.rate.toFixed(0)}% · Runway ${c.runway.toFixed(1)} months of essentials\n${tips.length?'\n**Fix next:**\n'+tips.map(t=>'- '+t).join('\n'):'\nYou are on track — keep investing the surplus.'}`;
}
const legacyAnswer=answerFinanceQuestion;
answerFinanceQuestion=function(q,u){
 const s=q.toLowerCase(),c=fctx(u);
 const risk=/low risk|safe|conservative/.test(s)?'low':/high risk|aggressive/.test(s)?'high':null;
 if(/laid off|job loss|lost my job|fired|unemploy|no income|salary (delay|stopp)/.test(s))return crisisText(c,'job',0);
 if(/medical|hospital|surgery/.test(s))return crisisText(c,'medical',300000);
 if(/crisis|emergenc|debt|broke|tight|recession|income drop|cash crunch|critical/.test(s))return crisisText(c,'cut',50);
 if(/insur|policy|policies|cover|term plan/.test(s))return insuranceText();
 if(/short.?term/.test(s)&&!/long/.test(s))return investText(c,'short',risk);
 if(/long.?term|retire|10 year|child/.test(s)&&!/short/.test(s))return investText(c,'long',risk);
 if(/invest|platform|where.*(save|put|park)|sip|mutual|ppf|nps|fd\b|best.*(app|scheme)|grow/.test(s))return investText(c,null,risk);
 if(/tax|80c|regime/.test(s))return `**Tax-saving options:** PPF, NSC, ELSS, 5-yr tax-saver FD and life/health premiums fall under 80C/80D (₹1.5L, old regime); NPS adds ₹50k under 80CCD(1B). The new regime has lower slab rates but few deductions — compare both for your salary before choosing. Confirm with a CA.`;
 if(/score|health|overall|analy|summary|how am i/.test(s))return healthText(c);
 if(/forecast|next month|predict|project/.test(s))return `At your 3-month average you'll earn ~${fmtINR(c.avgInc)} and spend ~${fmtINR(c.avgExp)} next month, leaving **${fmtINR(c.surplus)}**. In 12 months that's ~${fmtINR(c.surplus*12)} if nothing changes.`;
 if(/cut|reduce|trim|save more|overspend|cheaper/.test(s)){const top=CATEGORIES_EXPENSE.filter(k=>!ESSENTIAL.includes(k)).map(k=>[k,c.byCat[k]]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,3);return top.length?`Trim discretionary spending first: ${top.map(x=>`**${x[0]}** (~${fmtINR(x[1])}/mo)`).join(', ')}. A 20% cut saves ~${fmtINR(top.reduce((s,x)=>s+x[1],0)*0.2)}/mo. Then automate that amount into a SIP on salary day.`:'No discretionary spending logged — good discipline. Review Food and Transport next.';}
 if(/^(hi|hello|hey|help)/.test(s))return "Hi! I can analyse your finances, plan for a **crisis** (job loss, medical, debt), suggest **where to save** short/long term, and explain **insurance**. Try: \"I lost my job\" or \"best long-term investment for me\".";
 return legacyAnswer(q,u);
};
async function llm(q,u){
 const ep=localStorage.getItem('sf_ai_endpoint');if(!ep)return null;
 const c=fctx(u);
 const r=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:assistantMessages.filter(m=>!m.typing).slice(-10).map(m=>({role:m.role==='ai'?'assistant':'user',content:m.text})),summary:{avgIncome:c.avgInc,avgExpense:c.avgExp,essentials:c.ess,liquid:c.liquid,runwayMonths:c.runway,savingsRate:c.rate,score:c.score,country:'IN'}})});
 if(!r.ok)return null;return (await r.json()).reply||null;
}
function setLLM(){const v=prompt('LLM proxy URL (your server that calls Claude/OpenAI with the API key). Leave blank to use the on-device engine:',localStorage.getItem('sf_ai_endpoint')||'');if(v===null)return;v?localStorage.setItem('sf_ai_endpoint',v.trim()):localStorage.removeItem('sf_ai_endpoint');toast(v?'LLM endpoint saved.':'Using on-device engine.');}
const mdl=s=>escapeHtml(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/^- (.+)$/gm,'• $1').replace(/\n/g,'<br>');
function loadChat(){const u=DB.getSession();if(!u)return;try{const s=JSON.parse(localStorage.getItem('sf_chat_'+u)||'null');if(s&&s.length)assistantMessages=s;}catch(e){}}
renderAssistantLog=function(){
 const log=document.getElementById('assistant-log');if(!log)return;
 log.innerHTML=assistantMessages.map(m=>`<div class="chat-msg ${m.role==='ai'?'ai':'user'}"><div class="chat-avatar">${m.role==='ai'?'₹':'🙂'}</div><div class="bubble">${m.typing?'<i>Analysing your data…</i>':mdl(m.text)}</div></div>`).join('');
 log.scrollTop=log.scrollHeight;
};
askAssistant=async function(q){
 const u=DB.getSession();
 assistantMessages.push({role:'user',text:q},{role:'ai',text:'',typing:true});renderAssistantLog();
 let a=null;try{a=await llm(q,u);}catch(e){}
 if(!a){await new Promise(r=>setTimeout(r,500));a=answerFinanceQuestion(q,u);}
 assistantMessages.pop();assistantMessages.push({role:'ai',text:a});
 try{localStorage.setItem('sf_chat_'+u,JSON.stringify(assistantMessages.slice(-40)));}catch(e){}
 renderAssistantLog();
};
function clearChat(){assistantMessages=[{role:'ai',text:'Chat cleared. Ask me anything about your money.'}];localStorage.removeItem('sf_chat_'+DB.getSession());renderAssistantLog();}

/* ---------- pages ---------- */
function AdvisorView(){
 const c=fctx(DB.getSession()),ch=(q,l)=>`<button type="button" class="suggestion-chip" onclick="askAssistant('${q}')">${l}</button>`;
 return `<div class="grid-2" style="grid-template-columns:1.6fr .8fr">
 <div class="panel assistant-panel"><div class="panel-head"><h3>AI Financial Advisor</h3><span><button class="btn btn-ghost" onclick="setLLM()">⚙ Connect LLM</button><button class="btn btn-ghost" onclick="clearChat()">Clear</button></span></div>
 <div class="chat-log" id="assistant-log" style="max-height:52vh;min-height:320px"></div>
 <div class="chat-suggestions">${ch('I lost my job, what should I do?','🔴 Job loss plan')}${ch('Medical emergency, how do I manage money?','🏥 Medical emergency')}${ch('Best short-term option to save money','⏱ Short-term saving')}${ch('Best long-term investment for me','🌱 Long-term')}${ch('Which insurance policy should I buy?','🛡 Insurance')}${ch('Analyse my financial health','📊 Health check')}${ch('How can I cut expenses?','✂ Cut expenses')}</div>
 <div class="chat-input-row"><input type="text" id="assistant-input" placeholder="Ask anything — crisis, investing, insurance, tax…" onkeydown="if(event.key==='Enter'){event.preventDefault();sendAssistantMessage();}"><button class="btn btn-primary" onclick="sendAssistantMessage()">Send</button></div></div>
 <div><div class="stat-card hero-stat" style="margin-bottom:16px"><div class="label">Health score</div><div class="value">${c.score}/100</div><div class="delta">${scoreLabel(c.score)}</div></div>
 <div class="stat-card" style="margin-bottom:16px"><div class="label">Emergency runway</div><div class="value">${c.runway.toFixed(1)} mo</div><div class="delta ${c.runway>=6?'pos':'neg'}">Target 6 mo · ${fmtINR(c.target)}</div></div>
 <div class="stat-card"><div class="label">Monthly surplus</div><div class="value">${fmtINR(c.surplus)}</div><div class="delta">${c.rate.toFixed(0)}% savings rate</div></div></div></div>`;
}
function CrisisView(){return `<div class="panel" style="margin-bottom:18px"><div class="panel-head"><h3>What if…?</h3></div><div class="panel-body"><div class="field-row"><div class="field"><label>Scenario</label><select id="cz-sc" onchange="renderCrisis()"><option value="job">Lose job / all income</option><option value="cut">Income drops by %</option><option value="medical">Medical / emergency expense</option><option value="emi">New EMI / debt per month</option></select></div><div class="field"><label id="cz-lbl">Value</label><input type="number" id="cz-val" value="50" oninput="renderCrisis()"></div></div></div></div><div id="crisis-out"></div>`;}
function renderCrisis(){
 const el=document.getElementById('crisis-out');if(!el)return;const sc=document.getElementById('cz-sc').value,inp=document.getElementById('cz-val');
 const def={job:0,cut:50,medical:300000,emi:15000};if(inp.dataset.sc!==sc){inp.dataset.sc=sc;inp.value=def[sc];}
 document.getElementById('cz-lbl').textContent={job:'(not needed)',cut:'Drop %',medical:'Expense ₹',emi:'Extra EMI ₹/mo'}[sc];
 const c=fctx(DB.getSession()),v=Number(inp.value)||0,r=crisisCalc(c,sc,v),cls=r.mS<3?'over':r.mS<6?'warn':'ok';
 el.innerHTML=`<div class="stat-grid"><div class="stat-card"><div class="label">Cash available</div><div class="value">${fmtINR(r.cash)}</div></div><div class="stat-card"><div class="label">Runway now</div><div class="value">${fm(r.mN)}</div></div><div class="stat-card"><div class="label">Survival mode</div><div class="value">${fm(r.mS)}</div><div class="delta"><span class="status-pill ${cls}">${cls==='over'?'Critical':cls==='warn'?'Tight':'Manageable'}</span></div></div><div class="stat-card"><div class="label">Essentials / mo</div><div class="value">${fmtINR(c.ess)}</div></div></div>
 <div class="panel"><div class="panel-head"><h3>Action plan</h3><button class="btn btn-primary" onclick="applySurvival()">Apply survival budget</button></div><div class="panel-body" style="line-height:1.7;font-size:14px">${mdl(crisisText(c,sc,v))}</div></div>`;
}
function applySurvival(){const u=DB.getSession(),c=fctx(u),cb={};ESSENTIAL.forEach(k=>cb[k]=Math.round(c.byCat[k]/100)*100);saveBudget(u,currentMonthKey(),Math.round(c.ess*1.1/100)*100,cb);toast('Survival budget applied for this month.');}
function InvestView(){return `<div class="panel" style="margin-bottom:18px"><div class="panel-body"><div class="field-row" style="grid-template-columns:repeat(3,1fr)"><div class="field"><label>Goal horizon</label><select id="iv-h" onchange="renderInvest()"><option value="short">Short (&lt;3 yrs)</option><option value="medium">Medium (3–7 yrs)</option><option value="long" selected>Long (7+ yrs)</option></select></div><div class="field"><label>Risk comfort</label><select id="iv-r" onchange="renderInvest()"><option value="low">Low</option><option value="med" selected>Medium</option><option value="high">High</option></select></div><div class="field"><label>Monthly amount ₹</label><input type="number" id="iv-a" oninput="renderInvest()"></div></div></div></div><div id="invest-out"></div>`;}
function renderInvest(){
 const el=document.getElementById('invest-out');if(!el)return;const c=fctx(DB.getSession()),a=document.getElementById('iv-a');
 if(!a.value)a.value=Math.max(Math.round(c.surplus/500)*500,0);
 const h=document.getElementById('iv-h').value,rk=document.getElementById('iv-r').value,amt=Number(a.value)||0,yrs={short:2,medium:5,long:15}[h];
 const al=ALLOC[h][rk],gap=c.liquid<c.target,blend=al.reduce((s,[id,p])=>s+PRODUCTS[id].r*p/100,0);
 el.innerHTML=(gap?`<div class="demo-note" style="margin:0 0 16px">⚠ Emergency fund first: you hold ${c.runway.toFixed(1)} of 6 months (${fmtINR(c.target)}). Keep it in a liquid fund/sweep-in FD before locking money elsewhere.</div>`:'')+
 `<div class="panel"><div class="panel-head"><h3>Suggested split of ${fmtINR(amt)}/mo</h3><span class="status-pill ok">~${blend.toFixed(1)}% blended</span></div><div style="overflow-x:auto"><table class="data-table"><tr><th>Product</th><th>Split</th><th>Rate*</th><th>Lock-in</th><th>Tax</th><th>Where</th></tr>${al.map(([id,p])=>{const P=PRODUCTS[id];return `<tr><td><b>${P.n}</b><br><span style="font-size:11.5px;color:var(--ink-soft)">${P.why}</span></td><td class="num">${p}% · ${fmtINR(amt*p/100)}</td><td class="num">${P.r}%</td><td>${P.lock}</td><td>${P.tax}</td><td>${P.where}</td></tr>`;}).join('')}</table></div></div>
 <div class="stat-grid" style="margin-top:18px"><div class="stat-card"><div class="label">Invested (${yrs} yrs)</div><div class="value">${fmtINR(amt*yrs*12)}</div></div><div class="stat-card"><div class="label">Projected value</div><div class="value">${fmtINR(fv(amt,blend,yrs))}</div><div class="delta pos">+${fmtINR(fv(amt,blend,yrs)-amt*yrs*12)} growth</div></div></div>
 <div class="panel"><div class="panel-head"><h3>Insurance (protect first)</h3></div><div class="panel-body">${INSURANCE.map(x=>`<div style="margin-bottom:12px"><b>${x[0]}</b><div style="font-size:13px;color:var(--ink-soft)">${x[1]} ${x[2]}</div></div>`).join('')}</div></div>
 <p style="font-size:12px;color:var(--ink-soft);margin-top:14px">*Government small-savings rates: Jul–Sep 2026 (PPF 7.1%, NSC 7.7%, SSY/SCSS 8.2%, 1-yr/5-yr post-office TD 6.9%/7.5%); rates reset quarterly. Fund, NPS and gold returns are illustrative assumptions and can be negative. Platform names are examples, not endorsements. General education only — consult a SEBI-registered adviser before investing.</p>`;
}
function ReportsView(){
 const u=DB.getSession(),c=fctx(u),rows=Object.entries(c.byCat).filter(([k,v])=>v>0&&CATEGORIES_EXPENSE.includes(k)).sort((a,b)=>b[1]-a[1]);
 return `<div class="table-toolbar"><button class="btn btn-primary" onclick="exportCSV()">⬇ Export CSV</button><button class="btn btn-outline" onclick="window.print()">🖨 Print report</button></div>
 <div class="stat-grid"><div class="stat-card"><div class="label">Avg income / mo</div><div class="value">${fmtINR(c.avgInc)}</div></div><div class="stat-card"><div class="label">Avg spend / mo</div><div class="value">${fmtINR(c.avgExp)}</div></div><div class="stat-card"><div class="label">Savings rate</div><div class="value">${c.rate.toFixed(0)}%</div></div><div class="stat-card"><div class="label">Health score</div><div class="value">${c.score}/100</div></div></div>
 <div class="panel"><div class="panel-head"><h3>Average monthly spend by category (last 3 months)</h3></div><table class="data-table"><tr><th>Category</th><th style="text-align:right">Avg / month</th><th style="text-align:right">Share</th></tr>${rows.map(([k,v])=>`<tr><td>${EXPENSE_ICONS[k]||''} ${k}${ESSENTIAL.includes(k)?' <span class="cat-chip">essential</span>':''}</td><td class="amount-cell">${fmtINR(v)}</td><td class="amount-cell">${(v/c.avgExp*100).toFixed(0)}%</td></tr>`).join('')}</table></div>`;
}
function exportCSV(){
 const u=DB.getSession(),q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const rows=[['Type','Date','Category','Amount','Description']].concat(DB.list(u,'income').map(r=>['Income',r.date,r.category,r.amount,r.source]),DB.list(u,'expenses').map(r=>['Expense',r.date,r.category,r.amount,r.description]));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download='smartfinance-report.csv';a.click();toast('Report exported.');
}
function buildAlerts(u){
 const c=fctx(u),A=[],mk=currentMonthKey(),sp=categorySpentForMonth(u,mk);
 if(c.runway<3)A.push(['over','Emergency fund critical',`Only ${c.runway.toFixed(1)} months of essentials saved. Target ${fmtINR(c.target)}.`]);
 else if(c.runway<6)A.push(['warn','Emergency fund below target',`${c.runway.toFixed(1)} of 6 months covered.`]);
 if(c.surplus<0)A.push(['over','Spending exceeds income',`You overspend by ${fmtINR(-c.surplus)}/mo on average.`]);
 if(!c.b)A.push(['warn','No budget set','Set a monthly budget to get limit alerts.']);
 else Object.entries(c.b.categoryBudgets||{}).forEach(([k,v])=>{const s=budgetStatus(sp[k]||0,v);if(s&&s.level!=='ok')A.push([s.level,`${k}: ${s.label}`,`${fmtINR(sp[k])} of ${fmtINR(v)} used (${Math.round(s.pct)}%).`]);});
 if(c.ccShare>35)A.push(['warn','High credit-card usage',`${c.ccShare.toFixed(0)}% of spending is on credit cards — avoid interest by paying in full.`]);
 c.goals.filter(g=>g.savedAmount<g.targetAmount).forEach(g=>{const mo=Math.max(1,(new Date(g.targetDate)-new Date())/2.63e9),need=(g.targetAmount-g.savedAmount)/mo;if(need>c.surplus&&c.surplus>0)A.push(['warn',`Goal at risk: ${g.name}`,`Needs ${fmtINR(need)}/mo but surplus is ${fmtINR(c.surplus)}.`]);});
 return A;
}
function AlertsView(){const A=buildAlerts(DB.getSession());return `<div class="panel">${A.length?A.map(a=>`<div class="roadmap-card"><div><div class="rc-title">${escapeHtml(a[1])}</div><div class="rc-note">${escapeHtml(a[2])}</div></div><span class="status-pill ${a[0]}">${a[0]==='over'?'Urgent':'Watch'}</span></div>`).join(''):emptyState('✅','All clear','No alerts right now.')}</div>`;}

</script>
